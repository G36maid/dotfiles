# hypridle.conf — idle daemon
# docs: https://wiki.hyprland.org/Hypr-Ecosystem/hypridle
#
# Locks the screen via hyprlock after an idle timeout, before suspend, and on
# loginctl lock-session (e.g. triggered by waybar / systemd).

general {
    lock_cmd = pidof hyprlock || hyprlock      # avoid starting multiple hyprlock instances
    unlock_cmd = killall -SIGUSR1 hyprlock      # SIGUSR1 quits hyprlock (>=0.7.0)
    before_sleep_cmd = loginctl lock-session    # lock before suspend (triggers lock_cmd)
    after_sleep_cmd = hyprctl dispatch dpms on  # turn the display back on (no double keypress)
    ignore_dbus_inhibit = false                 # honor dbus idle-inhibit (firefox, steam, ...)
    ignore_systemd_inhibit = false              # honor systemd-inhibit --what=idle
}

# Auto-lock after 1 hr idle
listener {
    timeout = 3600                      # seconds
    on-timeout = loginctl lock-session   # locks via loginctl → triggers lock_cmd above
    on-resume = killall -SIGUSR1 hyprlock # unlock when activity resumes
}

# Turn the screen off after 2 hr idle
listener {
    timeout = 7200                      # seconds
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
