# hyprlock.conf — screen locker config
# docs: https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text supports pango markup (e.g. <b> or <i> tags)
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# launch manually (Super+L) or via hypridle on idle / before sleep

$font = FiraCode Nerd Font

general {
    hide_cursor = true          # hide the hardware cursor on the lock screen
    ignore_empty_input = true   # don't submit an empty password on Enter
    immediate_render = true     # draw the lock surface before resources finish loading
}

animations {
    enabled = true
    bezier = smooth, 0.16, 1, 0.3, 1
    animation = fadeIn,           1, 4, smooth
    animation = fadeOut,          1, 4, smooth
    animation = inputFieldDots,   1, 2, smooth   # typed-password dot animation
    animation = inputFieldColors, 1, 6, smooth   # border color transitions (check/fail)
}

# Background — blurred + dimmed wallpaper (matches hyprpaper), all monitors
# (swap path to "screenshot" for a dynamic blurred-desktop look instead)
background {
    monitor =
    path = ~/Pictures/wallpaper/nene_bfes_2026.png
    color = rgb(0, 0, 0)        # shown initially until the image finishes loading
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
    contrast = 0.9
    noise = 0.01
    vibrancy = 0.15
}

# Password field — cyan→green gradient matches Hyprland active_border
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.3)
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg
    capslock_color = rgba(ffaa00ee)
    font_color = rgb(220, 220, 220)
    font_family = $font
    rounding = 10
    placeholder_text = <i>Enter password...</i>
    fail_text = $PAMFAIL
    check_text = Authenticating...
    dots_size = 0.3
    dots_spacing = 0.25
    fade_on_empty = true
    fade_timeout = 5000
    position = 0, -20
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 5
}

# TIME — top right, big
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font
    color = rgba(255, 255, 255, 0.9)
    position = -30, 0
    halign = right
    valign = top
    shadow_passes = 1
    shadow_size = 3
}

# DATE — below the time, updates every minute
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 25
    font_family = $font
    color = rgba(200, 200, 200, 0.8)
    position = -30, -150
    halign = right
    valign = top
}
