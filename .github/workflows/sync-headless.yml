name: sync headless branch

# Keeps the `headless` branch in sync with `main`, applying the documented
# headless-pruning policy: `headless` is the TUI-only subset of `main`.
#   - bring every main change in via merge
#   - resolve conflicts on pruned GUI paths by keeping them deleted
#   - drop any GUI files main added
#   - fail loudly (never guess) if a retained TUI path conflicts
# Fires whenever `main` is pushed; pushes only `headless` (no recursion).

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: headless-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync + prune main -> headless
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Full mirror refs so origin/headless exists locally
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          # Rebase local headless onto the remote headless (never rewrite remote history)
          git checkout -q -B headless origin/headless
          BEFORE="$(git rev-parse headless)"

          # Paths pruned on headless (kept only on main)
          GUI_RE='^(hypr/|waybar/|wofi/|kitty/|fcitx5/|zed/|misc/.config/(code-flags\.conf|dolphinrc|mimeapps\.list))'

          # Bring in main; modify/delete conflicts on GUI paths are expected
          git merge --no-edit origin/main || true

          # Fail hard if a retained (non-GUI) path conflicts -- never auto-resolve those
          non_gui="$(git diff --name-only --diff-filter=U | grep -vE "$GUI_RE" || true)"
          if [ -n "$non_gui" ]; then
            echo "::error::Retained-path merge conflicts need manual attention:"
            echo "$non_gui"
            exit 1
          fi

          # Resolve GUI conflicts by keeping them deleted, and remove any GUI main added
          git rm -r -q --ignore-unmatch hypr waybar wofi kitty fcitx5 zed 2>/dev/null || true
          git rm -q --ignore-unmatch --cached \
            misc/.config/code-flags.conf misc/.config/dolphinrc misc/.config/mimeapps.list 2>/dev/null || true
          rm -rf -- hypr waybar wofi kitty fcitx5 zed 2>/dev/null || true
          git add -A

          # Finalize the merge if one is in progress
          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit --no-edit -q
          fi

          # Guard: nothing GUI may remain tracked after pruning
          left="$(git ls-files | grep -E "$GUI_RE" || true)"
          if [ -n "$left" ]; then
            echo "::error::GUI files still tracked after prune:"
            echo "$left"
            exit 1
          fi

          # No net change (e.g. a GUI-only push) -> nothing to publish
          if git diff --quiet "$BEFORE" HEAD; then
            echo "No net change to headless (GUI-only or redundant push); skipping."
            exit 0
          fi

          # Authenticate + push (fast-forward from origin/headless)
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin headless
          echo "Updated headless (main $GITHUB_SHA synced + GUI pruned)."
