name: sync headless branch

# `headless` is GENERATED from `main` on every push — never merged.
#
# Policy: main always has top priority. headless is a pure derived artifact:
#
#     headless tree == main tree - GUI paths
#
# The tree is rebuilt from main's tip and committed on top of the previous
# headless tip, so:
#   - no merges -> merge conflicts are impossible (the old merge-based flow
#     failed hard on retained-path conflicts, e.g. git/.gitconfig)
#   - pushes are always fast-forward (remote history is never rewritten)
#   - anything that existed only on headless is overwritten by design
# Fires whenever `main` is pushed; pushes only `headless` (no recursion).
# `workflow_dispatch` allows manual regeneration after editing this file.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: headless-sync
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main tip
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Generate headless = main - GUI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Parent for the generated commit (keeps the push fast-forward)
          git fetch --no-tags origin headless

          # Paths pruned on headless (GUI, kept only on main)
          GUI_RE='^(hypr/|waybar/|wofi/|kitty/|fcitx5/|zed/|misc/.config/(code-flags\.conf|dolphinrc|mimeapps\.list))'

          git checkout -q -B headless origin/headless
          BEFORE="$(git rev-parse HEAD)"

          # Rebuild the tree from main, exactly
          git read-tree -u --reset origin/main^{tree}

          # ... then prune the GUI paths.
          # -f is required and safe: after read-tree these paths are staged
          # (in index via main) but absent from HEAD (old headless), which
          # git rm otherwise refuses as "changes staged in the index".
          git rm -rqf --ignore-unmatch hypr waybar wofi kitty fcitx5 zed
          git rm -qf --ignore-unmatch \
            misc/.config/code-flags.conf misc/.config/dolphinrc misc/.config/mimeapps.list
          rm -rf -- hypr waybar wofi kitty fcitx5 zed

          # Guard: nothing GUI may remain tracked after pruning
          if left="$(git ls-files | grep -E "$GUI_RE")"; then
            echo "::error::GUI files still tracked after prune:"
            echo "$left"
            exit 1
          fi

          # No net change (GUI-only push or already synced) -> nothing to publish
          if git diff --cached --quiet "$BEFORE"; then
            echo "No net change to headless; skipping."
            exit 0
          fi

          git commit -q -m \
            "Generate headless from main ${GITHUB_SHA::7}: $(git log -1 --format=%s origin/main)"

          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin headless

          {
            echo "### headless regenerated"
            echo "| | |"
            echo "|---|---|"
            echo "| main | \`${GITHUB_SHA::7}\` |"
            echo "| headless | \`$(git rev-parse --short HEAD)\` |"
            echo "| paths changed | $(git diff --name-only "$BEFORE" HEAD | wc -l) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Updated headless (generated from main $GITHUB_SHA, GUI pruned)."
